[package]
name = "eon-office-calendar"
version.workspace = true
description = "EON Calendar: calendars, events with RFC 5545 repetition and exceptions, time zones, reminders, and iCalendar import and export, on the EON Office core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "eon_calendar"
path = "src/lib.rs"

[[bin]]
name = "eon-calendar"
path = "src/main.rs"

# Every dependency is a supply-chain commitment (madde 37).
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window (madde 2): the system webview.
tauri = { version = "2", features = [] }
# The EON Office library: the calendar's store, the shared search, the recent
# list, links, and the summaries EON Contacts publishes. Pinned by commit, as
# eon-stream-app pins eon-stream-core.
eon-office-core = { git = "https://github.com/EON-Extensible-Open-Network/eon-office-core", rev = "4279f8a4e7d75cc1ee63f844862436ab121ab3b7", version = "0.2.0" }
# One window per person: a second start hands its link to the first and exits.
tauri-plugin-single-instance = "2"
# Reminders appear where the person already looks: the operating system's
# notification centre.
tauri-plugin-notification = "2"
serde_json = "1"
# Time zones. A weekly 09:00 meeting in Istanbul stays at 09:00 there across
# daylight-saving changes elsewhere, and a reminder fires at the right
# instant, only with the IANA database. jiff carries it (bundled on Windows,
# the system's elsewhere) and does the conversions; writing our own would be
# a time-zone library nobody audits. Unlicense OR MIT.
jiff = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"
